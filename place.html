<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,intial=1.0">
    <meta name="description" content="Disover Papua New Guinea, its beautiful island, culture,and wearther">
    <title>Papua New Guinea| My Place</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js"defer></script>
</head>
<body>
    <header>
        <h1>Papua New Guinea</h1>
    </header>
    <main>
        <picture class="hero">
            <source
            media="(max-width:600px)"
            srcset="images/PNG-mobile.webp">
            <img 
                src="images/Island.jpg"
                alt="Beauitful topical islands and turquoise waters of Papua New Guinea">
        </picture>

        <section class="data">
            <h2>Data</h2>
            <p><strong>Area:</strong>18,274 km</p>
            <p><Strong>Population:</Strong>approximately 9300000</p>
            <p><strong>Capital:</strong>Port Moseby</p>
            <p><strong>Language:</strong>English</p>
            <p>,<strong>Currency:</strong>PNG Kain</p>
            <p><strong>Time Zone:</strong>UTC</p>
        </section>

        <section class="weather">
            <h2>weather</h2>
            <img
                class="weather-icon"
                src="images/icon.webp"
                alt="Partly cloudy weather">
                <p><strong>Condition:</strong>Partly Cloudy</p>
                <p><strong>Temperature</strong><span id="temperature">28</span>oC</p>
                <p><strong>Wind speed</strong><span id="wind-speed">12</span>km/h</p>
                <p><strong>Whind Chill</strong><span id="wind-chill">N/A</span></p>
        </section>
    </main>

    <footer>
        <p>@ <span id="currentyear"></span>| Paupa New Guinea</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
